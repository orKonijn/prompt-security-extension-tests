name: Extension policy tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate code
        run: npm run validate

      - name: Unpack the static extension
        run: |
          mkdir -p .local/extension
          unzip -q extension/prompt-extension.zip -d .local/extension
          test -f .local/extension/manifest.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run policy tests
        env:
          EXTENSION_PATH: .local/extension
          PROMPT_API_DOMAIN: ${{ vars.PROMPT_API_DOMAIN }}
          PROMPT_API_KEY: ${{ secrets.PROMPT_API_KEY }}
          HEADLESS: "false"
        run: xvfb-run -a npm test
